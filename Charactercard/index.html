<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charactercard</title>
    <link rel="stylesheet" href="index.css">
    <script src="index.js" defer></script>
    <meta property="og:type" content="website">
    <meta property="og:title" content="FSY Counselor Preference Form & Event Ticket">
    <meta property="og:description" content="Submit your preferences and generate your official custom event access ticket instantly.">
    <meta property="og:url" content="https://yourdomain.com/ETF.html">
    <meta property="og:image" content="https://yourdomain.com/images/social-preview.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="FSY Counselor Preference Form & Event Ticket">
    <meta name="twitter:description" content="Submit your preferences and generate your official custom event access ticket instantly.">
    <meta name="twitter:image" content="https://yourdomain.com/images/social-preview.png">

    <link rel="icon" href="favicon.ico">

    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
</head>
<body>
    <div class="card">
        <img src="snortleblat.webp" alt="Snortleblat" class="image" id="charImage">
        <div class="name" id="charName">Snortleblat</div>
        <div class="stats">
            <p><strong>Class:</strong> <span id="charClass"></span></p>
            <p><strong>Level:</strong> <span id="charLevel"></span></p>
            <p><strong>Health:</strong> <span id="charHealth"></span></p>
        </div>
        <div class="buttons">
            <button id="attackBtn">Get Attacked</button>
            <button id="levelUpBtn">Level Up</button>
        </div>
    </div>
</body>
</html>
